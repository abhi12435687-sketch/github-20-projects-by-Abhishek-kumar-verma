
<!DOCTYPE html>
<html>
<head>
    <title>ShopEasy - Online Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>ShopEasy</h1>
        <div>
            <input type="text" id="search" placeholder="Search products...">
            <button onclick="searchProducts()">Search</button>
            <button onclick="showCart()">Cart 🛒 (<span id="cartCount">0</span>)</button>
        </div>
    </header>

    <h2>Our Products</h2>

    <div class="filters">
        <button onclick="filterProducts('All')">All</button>
        <button onclick="filterProducts('Electronics')">Electronics</button>
        <button onclick="filterProducts('Clothing')">Clothing</button>
        <button onclick="filterProducts('Accessories')">Accessories</button>
    </div>

    <div id="productList" class="products"></div>

    <div id="cartSection">
        <h2>Your Shopping Cart</h2>
        <div id="cartItems"></div>
        <h3 id="total">Total: ₹0</h3>
        <button onclick="checkout()">Checkout</button>
        <button onclick="closeCart()">Continue Shopping</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
