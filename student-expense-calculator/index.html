
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Student Expense Calculator</h1>
        <p>Manage Your Money Smartly!</p>
    </header>

    <div class="container">

        <section class="budget-section">
            <h2>Set Your Budget</h2>

            <input type="number" id="budget" placeholder="Enter your budget">

            <button onclick="setBudget()">Set Budget</button>
        </section>

        <section class="summary">

            <div class="card">
                <h3>Total Budget</h3>
                <p id="total-budget">₹0</p>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <p id="total-expenses">₹0</p>
            </div>

            <div class="card">
                <h3>Remaining Budget</h3>
                <p id="remaining-budget">₹0</p>
            </div>

        </section>

        <section class="expense-section">

            <h2>Add New Expense</h2>

            <input type="text" id="expense-name"
                placeholder="Expense Name">

            <input type="number" id="expense-amount"
                placeholder="Expense Amount">

            <select id="category">
                <option value="">Select Category</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Education">Education</option>
                <option value="Shopping">Shopping</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>

            <button onclick="addExpense()">Add Expense</button>

            <p id="message"></p>

        </section>

        <section class="list-section">

            <h2>Expense History</h2>

            <div id="expense-list">
                <p>No expenses added yet.</p>
            </div>

        </section>

    </div>

    <footer>
        <p>© 2026 Student Expense Calculator</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
