
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest - Online Bookstore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📚 BookNest</h1>
        <nav>
            <a href="#books">Browse Books</a>
            <a href="#cart">My Cart</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Find Your Next Favourite Book</h2>
        <p>Explore stories, knowledge and imagination.</p>
    </section>

    <main>

        <section id="books">
            <h2>Explore Our Collection</h2>

            <div class="filters">

                <input
                    type="text"
                    id="search"
                    placeholder="Search by title or author..."
                    oninput="displayBooks()"
                >

                <select id="category" onchange="displayBooks()">
                    <option value="All">All Categories</option>
                    <option value="Fiction">Fiction</option>
                    <option value="Technology">Technology</option>
                    <option value="Science">Science</option>
                    <option value="Self Help">Self Help</option>
                </select>

            </div>

            <div id="book-container" class="book-container">
            </div>

        </section>

        <section id="cart">
            <h2>Shopping Cart</h2>

            <div id="cart-items">
                <p class="empty">Your cart is empty.</p>
            </div>

            <div class="summary">
                <h3>Order Summary</h3>

                <p>Items: <span id="item-count">0</span></p>

                <h3>Total: ₹<span id="total">0</span></h3>

                <button onclick="checkout()">Checkout</button>
            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 BookNest. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
